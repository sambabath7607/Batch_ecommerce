{% extends "base.html" %}
{% block title %}Inscription - Boutique{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="form-card">
        <h1>Inscription</h1>
        <p class="form-subtitle">Créez votre compte gratuitement.</p>
        <form action="" method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="form-actions">
                <button class="btn btn-primary" type="submit">S'inscrire</button>
            </div>
        </form>
        <p class="form-note">
            Déjà inscrit ? <a href="{% url 'login' %}">Se connecter</a>
        </p>
    </div>
</div>
{% endblock %}
